# fleetsmith fleet spec — componant-ui-harness
# Pattern: fanout (independent component/screen/hook builds in parallel) with a
# generate→verify edge from each producer to the compliance-reviewer, plus an
# iteration loop that bounces failures back to the producer who owns the code.
# Authored by fleet-architect (Phase 2). Skill bodies authored by skill-smith (Phase 3).
version: 1
fleet:
  name: componant-ui-harness
  domain: React component library (ui-common-components) — design-system-governed component, hook, and screen authoring with WCAG 2.2 AA / security / responsiveness compliance review
  pattern: fanout
  execution: subagents
  # Justified: component-author writes src/components/** + packages/ui-common-hooks/**
  # (library code); screen-composer writes the Next.js demo app pages (app/** / pages/**).
  # Disjoint path trees — no shared file is edited by both. Validated by the domain brief's
  # work-type table (types 1/2/4/7 vs type 3).
  allowParallelWrites: true
  loop:
    until: compliance-reviewer returns PASS on accessibility, security, and responsiveness for the artifact under review
    max: 3
    check: npm test -- --run
agents:
  - name: component-author
    role: >
      Builds React components (atoms/molecules/charts), authors their Storybook stories,
      adds/extends hooks in ui-common-hooks, and migrates legacy props/APIs to canonical
      export names. Owns work types 1, 2, 4, 7 from the domain brief. Reads AGENTS.md and
      follows its 20-file reading order and Always/Never rules — does not restate them.
      Self-checks every artifact against _fleet/QUALITY_CHECKLIST.md (A, B, C) before
      handing off to compliance-reviewer.
    goal: >
      Ship a component/hook dir that matches the canonical file pattern
      ({Name}.types.ts + {Name}.config.ts + index.tsx + {Name}.stories.tsx + {Name}.test.tsx
      + optional {Name}.css), is barrel-exported from src/index.tsx, passes npm test,
      and self-clears the quality checklist.
    capabilities:
      read: true
      edit: true
      run: true
    skills:
      - component-authoring
    handoff:
      to:
        - compliance-reviewer
      artifact: component-author-build.md
      criteria:
        - New/changed files follow the canonical component dir pattern with barrel export in src/index.tsx
        - No legacy aliases (AppShell, Avatar, Tooltip, TextInput, variant="outlined"/"filled") appear in new code
        - Self-check notes for accessibility, security, and responsiveness cite file:line per dimension
        - npm test passes for the touched files

  - name: screen-composer
    role: >
      Composes Next.js screens/pages from library components — 5-zone layout (ZONE 1 AppTopbar,
      ZONE 2 notification strip, ZONE 3 filters/tabs/breadcrumb, ZONE 4 main content,
      ZONE 5 footer), CTA hierarchy (one variant="primary" per zone max), DashboardShell +
      FeedbackStates + useAsyncContentPhase. Owns work type 3. Reads AGENTS.md and
      docs/internal/ (APP_TOPBAR_SYSTEM.md, SIDEBAR_NAVIGATION_SYSTEM.md, PACKAGES.md) before
      composing — does not restate them. Self-checks composition-specific checklist items
      (C1, C7, A5, A7) plus the full A/B/C sweep before handing off.
    goal: >
      Ship a Next.js page that composes library components per the 5-zone layout, preserves
      CTA hierarchy, pairs feedback states with useAsyncContentPhase, and self-clears the
      quality checklist.
    capabilities:
      read: true
      edit: true
      run: true
    skills:
      - screen-composition
    handoff:
      to:
        - compliance-reviewer
      artifact: screen-composer-build.md
      criteria:
        - Page uses DashboardShell (not raw flex+sidebar) and defines all 5 zones explicitly
        - No more than one variant="primary" Button per zone (no competing CTAs)
        - Self-check notes for accessibility, security, and responsiveness cite file:line per dimension
        - npm run build succeeds for the demo app (or the touched page compiles in isolation)

  - name: compliance-reviewer
    role: >
      Read-only verifier. Audits components (work type 5) and reviews PR diffs (work type 6)
      against AGENTS.md Always/Never rules AND _fleet/QUALITY_CHECKLIST.md across three
      first-class dimensions — Accessibility (WCAG 2.2 AA, A1-A10), Security (B1-B7), and
      Responsiveness (C1-C7). Cannot edit source: its only output is a verdict file with
      PASS/FAIL per dimension, file:line evidence per failure, and a ranked fix list naming
      the owning producer agent. A FAIL bounces the artifact back to the producer via the
      iteration loop.
    goal: >
      Produce a verdict file that an outside reader can act on without asking questions —
      every failure names the rule, the file:line, and the owner agent.
    capabilities:
      read: true
      run: true
    skills:
      - compliance-review
    handoff:
      to: []
      artifact: compliance-reviewer-verdict.md
      criteria:
        - Verdict has a PASS/FAIL line for each of Accessibility, Security, Responsiveness
        - Every FAIL cites file:line and the checklist item id (e.g. A4, B1, C2)
        - Ranked fix list names the owning agent (component-author or screen-composer)
        - No source files were edited by the reviewer (diff is empty for src/**)

skills:
  - name: component-authoring
    description: >
      Use when building, extending, or migrating a React component in ui-common-components
      (atoms/molecules/charts), writing its Storybook stories, or adding a hook to
      ui-common-hooks. Triggers on requests to "build component", "add story", "create hook",
      "migrate AppShell/Avatar/Tooltip/TextInput", or "add variant".
    body: |
      Serves the component-author agent. Scope: canonical component file pattern
      ({Name}.types.ts + {Name}.config.ts + index.tsx + {Name}.stories.tsx + {Name}.test.tsx
      + optional {Name}.css), barrel export in src/index.tsx, TypeScript prop discipline
      (read *.types.ts before generating — never invent props), Tailwind+CSS-variable tokens
      (never hardcode hex/px), Storybook 8.6 Playground-first stories with argTypes on meta,
      WCAG 2.2 AA baseline, legacy export-name migration (Avtar not Avatar, ToolTip not
      Tooltip, Input not TextInput, DashboardShell not AppShell, variant="bordered" not
      "outlined"/"filled"), and self-check against _fleet/QUALITY_CHECKLIST.md sections A, B, C
      before marking the build done. The agent reads AGENTS.md (root) and follows its 20-file
      reading order and Always/Never rules — this skill extends, never restates, that file.
      ## 1. Canonical component dir — author every file, in this order
      Every new/migrated component lives in `src/components/{atoms|molecules|charts}/{Name}/`
      and is barrel-exported from `src/index.tsx` (idempotent — never duplicate an export).
      Read an existing dir first (e.g. `src/components/atoms/Button/`) to match house style.
      File contract (all required unless marked optional):

      - `{Name}.types.ts` — public API surface. Define the **prop interface** (e.g.
        `ButtonProps`), every **variant union** (e.g. `"primary" | "ghost" | …`), every
        **size union** (`"sm" | "md" | …`), and any sub-unions (`tone`, `shape`).
        Re-export the unions from this file — `*.config.ts` and consumers import them here.
      - `{Name}.config.ts` — pure maps, no React. `variantClasses: Record<Variant,string>`
        (variant → CSS class from `tokens.css`), `sizeClasses: Record<Size,string>`,
        and `defaultProps` (the values used when a prop is omitted — e.g. Button defaults
        `variant` to `"primary"`, `size` to `"lg"`). This is the single place to change
        how a variant looks; never duplicate these maps in `index.tsx`.
      - `index.tsx` — the component. `forwardRef`, set `displayName`, read classes from
        `*.config.ts`, merge `className` last (consumer escape hatch, never the primary
        styling path). Spread `...rest` for native HTML attrs. Render with tokens via the
        config classes — do not inline hex/px.
      - `{Name}.stories.tsx` — **Playground story first** (see §4). Then one story per
        variant and per size. Title under `Design System/{Atoms|Molecules|Charts}/{Name}`.
      - `{Name}.test.tsx` — vitest + jsdom. Three test classes, all required: (a)
        **rendering** — renders with default props, renders each variant, renders
        disabled/loading; (b) **a11y** — has an accessible name (icon-only uses
        `ariaLabel`), focus ring renders, role correct; (c) **interaction** — click
        fires `onClick`, `disabled` blocks click, `loading` blocks click and shows
        spinner, keyboard `Enter`/`Space` activate.
      - `{Name}.css` (optional) — component-scoped styles. Only when a visual needs
        CSS `:hover`/`:focus-visible`/`@media` that a class in `tokens.css` doesn't
        already cover. Scope selectors to `.btn-*` / `.card-*` (never tag selectors).
        Use `var(--color-*)` / `var(--space-*)` / `var(--radius-*)` / `var(--shadow-*)`
        only.

      ## 2. Prop discovery — types-first, never invent
      Before writing any JSX that uses a library component (yours or an existing one),
      discover the real props. Order:
      1. Read `node_modules/ui-common-components/dist/index.d.ts` for the **published**
         API (use this when consuming; it is the contract). If the package isn't
         installed, read the component's own `{Name}.types.ts` in `src/components/`.
      2. Map the user's intent → props using the intent tables in `AGENTS.md` →
         "Card — intent → props", "Button — intent → props", "Badge — intent → props".
         Do NOT guess from generic React/Tailwind habits — `variant` means different
         things per component (Card=`bordered|elevated|withIndicator`,
         Button=`primary|ghost|…`, Badge=`neutral|danger|…`,
         Input=`outlined|filled|borderless|underlined`).
      3. If a prop doesn't exist in `.types.ts`, do not use it. File a gap — do not
         paper over it with `className`/`style`/Tailwind. That is the #1 historical
         failure (was 3/10, now 8/10 after docs improved — don't regress it).

      ## 3. Token usage — CSS variables, never hex/px
      Read `src/design-system/tokens.css` for the full token list; reference it, don't
      restate. The always-true rules:
      - Colors: `var(--color-*)` (e.g. `--color-bg-page`, `--color-text-primary`,
        `--color-brand-primary`, `--color-danger-strong`, `--color-border-default`,
        `--color-focus-ring`). NEVER hardcode hex (`#fff`, `#999`).
      - Spacing: `var(--space-*)`. NEVER hardcode px padding/margin.
      - Radii: `var(--radius-*)`. NEVER hardcode `border-radius`.
      - Shadows: `var(--shadow-*)`. NEVER hardcode `box-shadow`.
      - Tailwind utilities are for **layout** only (flex, grid, gap, `min-w-0`,
        `overflow-hidden`). NEVER use Tailwind for visual properties a prop covers
        (`variant`, `elevation`, `tone`, `size`, `rounded`, `borderTop`).
      - Escape-hatch discipline: `backgroundColor`/`borderColor`/`textColor`/
        `classOverrides` exist on Button for one-off brand overrides — do not use them
        unless the user explicitly requests a one-off. Prefer `variant` + `size` +
        `rounded`. (Follow AGENTS.md → "Always/Never rules".)

      ## 4. Story authoring — Playground-first
      Every component story must export **Playground** as the first story, with
      `argTypes` on `meta` (not on the story) so the Controls panel is the live prop
      catalog. Pattern (see `src/components/atoms/Button/Button.stories.tsx`):
      ```tsx
      const meta: Meta<typeof Button> = {
        title: "Design System/Atoms/Button",
        component: Button,
        tags: ["autodocs"],
        argTypes: { variant: { control: "select", options: [...] }, ... },
      };
      export default meta;
      export const Playground: StoryObj<typeof Button> = { args: { children: "Click", variant: "primary", size: "lg" } };
      export const Primary = { args: { ... } };
      // ...one story per variant
      ```
      - Use the Storybook decorator classes from `.storybook/preview.css` for layout:
        `sb-page` (story canvas), `sb-card`/`sb-card-header`/`sb-card-title` (grouping),
        `sb-stack` (vertical stack), `sb-grid` (grid), `sb-inline` (row), `sb-divider`.
      - Test in both themes: toggle `[data-theme="dark"]` (Storybook theme toolbar).
      - Test at all viewports: 375 (mobile), 768 (tablet), 1440 (desktop) via the
        viewport toolbar.

      ## 5. Legacy migration table
      When migrating legacy code, apply this table. Verify the canonical name by
      checking `src/index.tsx` barrel exports — the export that is NOT marked
      `@deprecated` is the canonical one.
      | Legacy | Canonical | Notes |
      |---|---|---|
      | `AppShell` | `DashboardShell` | `AppShell` is exported as a `@deprecated` alias |
      | `Avatar` | `Avtar` | spelling is intentional in this library |
      | `Tooltip` | `ToolTip` | spelling is intentional |
      | `TextInput` | `Input` | `InputSearch` is separate (search input) |
      | `variant="outlined"` (Card) | `variant="bordered"` | also `"filled"` → `"bordered"` |
      Grep your generated code for the legacy names before handing off — the
      compliance-reviewer will grep for them too.

      ## 6. Pre-handoff self-check — QUALITY_CHECKLIST.md sections A, B, C
      Before marking the build done, walk the new component through
      `_fleet/QUALITY_CHECKLIST.md` (the testable checklist — do not restate it here).
      For each dimension, record **file:line evidence** of the pass (or fix the fail):
      - **A (Accessibility, A1-A10):** keyboard-reachable? focus ring via `--color-focus-ring`?
        contrast ≥4.5:1 (use the formula: relative luminance
        `L = 0.2126*R+0.7152*G+0.0722*B` with sRGB linearization, ratio
        `(L1+0.05)/(L2+0.05)`)? 44×44px touch target? label/aria-label on inputs?
        `aria-live` on feedback states?
      - **B (Security, B1-B7):** no `dangerouslySetInnerHTML`? no `eval`/`new Function`?
        no inline handlers? Modal traps focus (via `useFocusTrap`)? Popover dismisses
        on outside-click + Escape (via `useDismissableLayer`)?
      - **C (Responsiveness, C1-C7):** renders at 375/768/1440? no fixed width breaking
        below 375? dark mode holds contrast? `prefers-reduced-motion` respected?
      Write the evidence (e.g. `A3 focus ring — src/components/X/index.tsx:42 (uses
      --color-focus-ring)`) into the handoff notes for compliance-reviewer to verify.
      Run `npm test -- --run` for the touched files — must pass before handoff.

  - name: screen-composition
    description: >
      Use when composing a Next.js screen or page from ui-common-components library pieces —
      dashboard, list, form, or detail pages. Triggers on requests to "build screen",
      "compose page", "create dashboard", "layout a page", or "wire FeedbackStates".
    body: |
      Serves the screen-composer agent. Scope: 5-zone layout (ZONE 1 AppTopbar + primary CTA,
      ZONE 2 OfflineBanner/notification strip, ZONE 3 filters/tabs/breadcrumb, ZONE 4 main
      content with Table|EmptyState|ErrorState|Charts|Form, ZONE 5 pagination/footer), CTA
      hierarchy (one variant="primary" per zone max, ghost for row/footer actions),
      DashboardShell + AppSidebar + AppTopbar composition (no raw flex+sidebar), FeedbackStates
      + useAsyncContentPhase pairing, compound Card/Table/Tabs APIs, and self-check against
      _fleet/QUALITY_CHECKLIST.md (C1, C7, A5, A7 explicitly, full A/B/C sweep) before
      handoff. The agent reads AGENTS.md and docs/internal/ (APP_TOPBAR_SYSTEM.md,
      SIDEBAR_NAVIGATION_SYSTEM.md, PACKAGES.md) — this skill extends, never restates, them.
      ## 1. Zone-by-zone composition — the 5-zone layout
      Before writing any JSX, sketch the 5 zones (AGENTS.md → "The 5 visual zones";
      `docs/COMPOSITION_RULES_1.md` for density rules). Every screen composes all 5
      (omit a zone only if the FRD says so — and say so in a comment). Each zone maps
      to a fixed slot inside `DashboardShell`'s content region:

      - **ZONE 1 — AppTopbar (page title + primary CTA).** Render `<AppTopbar />` as
        the `topbar` prop of `DashboardShell` (NOT inside `children` — the shell pins
        it above the scroll region via flex). Pass the page title and at most one
        `variant="primary"` button (the page's main action — "Create", "Save").
        Read `docs/internal/APP_TOPBAR_SYSTEM.md` for the AppTopbar API (search
        expansion, hamburger on mobile).
      - **ZONE 2 — Notification strip (OfflineBanner).** Slim sticky strip at the top
        of the content region. Use `<OfflineBanner />` (no `image` prop for the slim
        variant) driven by `useOnlineStatus()`:
        ```tsx
        const { online } = useOnlineStatus();
        {!online && <OfflineBanner />}  // slim strip, role="status", aria-live="polite"
        ```
        For a full-panel replacement (content area is unreachable), render
        `<OfflineBanner image={<OfflineAnimation size={110} />} />` inside Zone 4.
      - **ZONE 3 — Filters / tabs / breadcrumb.** `Tabs` (with `TabsList`/`TabsTrigger`/
        `TabsContent`), `Breadcrumb`, or filter `Input`/`Select` row. This zone
        controls what Zone 4 displays — wire its state to the data fetch
        (`useAsyncData` / `useAsyncContentPhase`).
      - **ZONE 4 — Main content.** `Table`, `EmptyState`, `ErrorState`, `Charts`,
        `Form`, or a `Card` grid. **Always** pair this zone with
        `useAsyncContentPhase` (see §4) so loading/offline/error/empty/ready are
        handled — never render a bare `Table` without a phase guard.
      - **ZONE 5 — Pagination / footer / secondary actions.** `usePagination` for
        page state + `ghost` buttons for secondary actions (Export, Bulk actions).

      ## 2. CTA hierarchy — one primary per zone max
      Decision tree (follow AGENTS.md → "CTA hierarchy rule"; do not restate the
      table — apply it):
      1. Is this the **single main action** for the zone? → `variant="primary"`,
         `size="md"` or `"lg"`. One per zone. If you already placed one, the next
         action is NOT primary.
      2. Is this a **secondary action in Zone 1** (alongside the primary)? →
         `variant="outlineSecondary"`, `size="sm"`.
      3. Is this a **row action** (Edit/Delete in a Table row) or a **footer action**
         (Export in Zone 5)? → `variant="ghost"`, `size="sm"`.
      4. Is this a **retry** in an `ErrorState`? → `variant="outlinePrimary"`,
         `size="md"` (recovery, not destructive).
      5. Is this an **escape hatch** in an `EmptyState` (secondary to the primary
         "create" CTA)? → `variant="ghost"`, `size="sm"`.
      6. Is this **destructive** (delete confirmation)? → `variant="danger"`.
      **Never** place two `variant="primary"` buttons at the same size and position.
      Before handoff, count `variant="primary"` per zone — if any zone has >1, fix it.

      ## 3. DashboardShell API — use the shell, not raw flex
      Use `<DashboardShell>` (NOT `AppShell` — legacy alias; NOT raw `flex` + a
      sidebar div). Read `src/components/molecules/DashboardShell/DashboardShell.tsx`
      for the source of truth. The shell contract:
      ```tsx
      <DashboardShell
        sidebar={{ header, sections, activeItemId, fixed: true }}
        topbar={<AppTopbar title="..." primaryAction={...} />}
        contentClassName="p-6"
      >
        {/* ZONES 2-5 live here, inside the scroll region */}
      </DashboardShell>
      ```
      - `sidebar` — `AppSidebar` props: `header` (logo/brand), `sections` (nav groups
        with items), `activeItemId`. Read `docs/internal/SIDEBAR_NAVIGATION_SYSTEM.md`
        for collapse/rail/drawer behavior on mobile.
      - `topbar` — pass `<AppTopbar />` as a ReactNode. The shell sets
        `sticky={false}` on it (`pinTopbar` default `true`) to avoid sticky-vs-scroll
        bugs; the bar stays pinned by **flex layout**, not CSS `sticky`.
      - `contentClassName` / `contentStyle` — style the scroll region (padding, bg).
      - **The shell manages the right column's `margin-inline-start`** via
        `var(--app-sidebar-offset)` so it tracks the sidebar width. Do NOT set
        `marginLeft: 320` yourself — it leaves a gap when the sidebar collapses to a
        rail on narrow screens (README warning; QUALITY_CHECKLIST C1).

      ## 4. FeedbackStates + useAsyncContentPhase — the state machine
      Zone 4 must pair with the phase machine. Read
      `packages/ui-common-hooks/src/useAsyncContentPhase.ts` for the priority order
      (loading → offline → error → empty → ready). Pattern:
      ```tsx
      const { data, loading, error } = useAsyncData(fetchFn, [deps]);
      const { phase } = useAsyncContentPhase({
        items: data ?? [],
        loading,
        error,
        requireNetwork: true,
      });
      // phase drives what renders:
      if (phase === "loading") return <Spinner />;
      if (phase === "offline") return <OfflineBanner image={<OfflineAnimation size={110} />} />;
      if (phase === "error") return <ErrorState image={<ErrorAnimation />} action={<Button variant="outlinePrimary" onClick={retry}>Retry</Button>} />;
      if (phase === "empty") return <EmptyState image={<NoDataAnimation size={120} />} action={<Button variant="primary">Create</Button>} />;
      return <Table data={data} columns={columns} />;
      ```
      Or use the `<FeedbackState variant={phase} />` router (delegates to the right
      component per variant — see `FeedbackStates/FeedbackState.tsx`). Import the
      CSS animations (`NoDataAnimation`, `ErrorAnimation`, `OfflineAnimation`,
      `SuccessAnimation`, `InfoAnimation`, `NoSearchResultsAnimation`) from
      `ui-common-components` and pass as the `image` prop. `aria-live` is built in —
      verify it is present (QUALITY_CHECKLIST A8).

      ## 5. Compound-component patterns — semantic HTML
      Prefer compound APIs over prop soup (AGENTS.md → "Prop discovery" step 4):
      - **Card:** `<Card variant="bordered">` with `<CardHeader>`, `<CardTitle>`,
        `<CardDescription>`, `<CardAction>`, `<CardContent>`, `<CardFooter>`. Use
        `CardAction` for the zone's CTA (kept in the header, not floating).
        `CardFooter` with `borderTop={false}` for a softer footer line.
      - **Table:** for semantic HTML, use the primitives `<TableHeader>`,
        `<TableBody>`, `<TableRow>`, `<TableHead>` (with `scope="col"`),
        `<TableCell>` inside `<Table>` — not the data-driven `columns`/`data` API
        when you need full control. Data-driven API is fine for simple cases; always
        include `<TableHead>` with column headers (QUALITY_CHECKLIST A6).
      - **Tabs:** `<Tabs>` with `<TabsList>`, `<TabsTrigger>`, `<TabsContent>`.
        Wire `value`/`onValueChange` to control which Zone 4 view shows.

      ## 6. Pre-handoff self-check — QUALITY_CHECKLIST.md
      Before handoff, walk the composed page through `_fleet/QUALITY_CHECKLIST.md`.
      These items are composition-specific and must be checked explicitly:
      - **C1 (breakpoints):** render at 375, 768, 1440. No horizontal scrollbar at 375
        (except intentional Table scroll). DashboardShell sidebar collapses to
        rail/drawer on narrow — no `marginLeft: 320` gap.
      - **C7 (density + zones):** all 5 zones hold at every breakpoint (stack on
        mobile, don't disappear). CTA hierarchy preserved across reflow — no new
        `variant="primary"` introduced by responsive reflow.
      - **A5 (forms/labels):** every `Input`/`Select`/`Combobox`/`DatePicker` has a
        `<label>` or `aria-label` via `id`. Error messages linked via
        `aria-describedby`. `aria-live="polite"` on status, `"assertive"` on errors.
      - **A7 (overlays/dialogs):** `Modal`/`AlertDialog` have `aria-label`/`aria-labelledby`.
        `Popover`/`DropdownMenu` triggers have `aria-haspopup` + `aria-expanded`.
        Focus returns to trigger on close.
      Then run the full A/B/C sweep (A1-A10, B1-B7, C1-C7) and record file:line
      evidence per dimension in the handoff notes. Run `npm run build` for the demo
      app (or compile the touched page in isolation) — must succeed before handoff.

  - name: compliance-review
    description: >
      Use when auditing a ui-common-components component against the design system, or
      reviewing a PR/diff for compliance. Triggers on "audit component", "review PR",
      "check accessibility", "check security", "check responsiveness", "WCAG check", or
      "compliance review".
    body: |
      Serves the compliance-reviewer agent. Scope: read-only verification across three
      first-class dimensions — Accessibility (WCAG 2.2 AA, A1-A10), Security (B1-B7), and
      Responsiveness (C1-C7) — plus the AGENTS.md Always/Never rules and export-name gotchas.
      Primary input is _fleet/QUALITY_CHECKLIST.md (the testable checklist); secondary inputs
      are AGENTS.md and docs/design-system/COMPONENT_AUDIT.md. The agent produces a verdict
      file in the format specified at the bottom of QUALITY_CHECKLIST.md: PASS/FAIL per
      dimension, file:line evidence per failure, checklist item id (A4, B1, C2) per finding,
      and a ranked fix list naming the owning producer (component-author or screen-composer).
      The reviewer never edits source — its only write is the verdict file. A FAIL on any
      dimension bounces the artifact back to the producer via the fleet's iteration loop.
      ## 0. Primary input
      `_fleet/QUALITY_CHECKLIST.md` is the testable checklist (A1-A10, B1-B7, C1-C7)
      and the source of truth for the verdict format (bottom of that file). Read it
      first on every review. This skill encodes the **workflow** for checking each
      item; it does not restate the items. Secondary inputs: `AGENTS.md` (Always/Never
      rules, export-name gotchas, intent tables), `docs/design-system/COMPONENT_AUDIT.md`.

      ## 1. Accessibility review (A1-A10) — WCAG 2.2 AA
      Run each item; cite `file:line` for pass or fail.

      - **A1 Keyboard operability:** Tab through every interactive element in the
        target (render it, or read the JSX and trace the tab order). Verify `Enter`
        activates buttons/links, `Space` activates buttons, `Escape` closes
        `Modal`/`AlertDialog`/`Popover`/`DropdownMenu`/`Combobox` (these use
        `useDismissableLayer` — grep for the hook to confirm it's wired). Verify Tab
        cycles within `Modal`/`Popover` (uses `useFocusTrap` — grep to confirm) and
        does NOT escape to background. Verify no keyboard trap (Tab can leave any
        container). Verify arrow-key nav on `Tabs`/`Combobox`/`Stepper`/`Calendar`
        per ARIA APG.
      - **A2 Touch targets:** measure interactive elements — ≥44×44px, ≥8px gap
        between adjacent. Check the `size` prop on `Button` (`sm` min on mobile,
        never `xxs`/`xs` for primary actions).
      - **A3 Focus visibility:** grep for `outline: none` / `outline-none` without a
        replacement — fail. Verify `:focus-visible` is used (not `:focus`). Verify
        focus ring uses `--color-focus-ring` token. Verify no positive `tabindex`
        unless justified.
      - **A4 Color & contrast:** **calculate** the ratio — do not eyeball.
        Relative luminance: linearize each sRGB channel
        (`c <= 0.03928 ? c/12.92 : ((c+0.055)/1.055)^2.4`), then
        `L = 0.2126*R + 0.7152*G + 0.0722*B`. Ratio = `(L1+0.05)/(L2+0.05)` where L1
        is the lighter. Pass if ≥4.5:1 (normal text) or ≥3:1 (large text ≥24px or
        ≥19px bold, and non-text UI per WCAG 1.4.11). Verify color is not the sole
        carrier of meaning (badges pair color + text/icon). Verify dark mode
        (`[data-theme="dark"]`) maintains ratios — recompute with dark-theme tokens.
      - **A5 Forms & labels:** every `Input`/`TextArea`/`Select`/`Combobox`/`OtpBox`/
        `DatePicker` has a `<label>` (or `aria-label`/`aria-labelledby`) associated
        via `id`. Errors linked via `aria-describedby`. Required fields have
        `aria-required="true"` + visible indicator. `aria-live="polite"` on status,
        `"assertive"` on errors.
      - **A6 Tables:** `Table` has `TableHead` with `<th scope="col">`. Row headers
        `<th scope="row">` when needed. Caption or `aria-label` describes content.
      - **A7 Overlays & dialogs:** `Modal`/`AlertDialog` have `aria-label` or
        `aria-labelledby`. `Popover`/`DropdownMenu` triggers have `aria-haspopup`
        and `aria-expanded`. Background has `aria-hidden="true"` or `inert` while
        open. Focus returns to trigger on close.
      - **A8 Feedback states:** `EmptyState`/`ErrorState` have `aria-labelledby` +
        `aria-describedby` (built-in via `useId` — verify). `OfflineBanner` has
        `role="status"` + `aria-live="polite"`. `FeedbackState` announces changes.
      - **A9 Motion:** `prefers-reduced-motion` respected (grep for
        `usePrefersReducedMotion` or `@media (prefers-reduced-motion)`). No auto-play
        >5s without pause. CSS animations degrade when reduced.
      - **A10 Screen reader semantics:** icon-only buttons have `ariaLabel`.
        Decorative icons have `aria-hidden="true"`. Live regions announce dynamic
        changes.

      ## 2. Security review (B1-B7)
      - **B1 XSS:** grep the target for `dangerouslySetInnerHTML`, `innerHTML`,
        `outerHTML`, `document.write` — any hit is a FAIL (AGENTS.md Never rule).
        Verify `TextView`/`GradientText`/`Hyperlink` content is text-interpolated.
        Verify `Modal`/`AlertDialog` titles/descriptions are text, not parsed HTML.
      - **B2 Input sanitization:** verify `Input`/`TextArea`/`Combobox` render values
        via JSX (auto-escaped) — no manual DOM manipulation (`appendChild`,
        `insertAdjacentHTML`). Verify `OtpBox` with `mask` masks and doesn't log.
        Verify `Input` with `disableClipboard` blocks copy on sensitive fields.
        Verify `FileUpload`/`Dropzone` validates type/size/count.
      - **B3 Focus security:** verify `Modal`/`AlertDialog` trap focus
        (`useFocusTrap` wired) and restore focus to trigger on close. Verify
        `Popover`/`DropdownMenu` dismiss on outside-click + Escape
        (`useDismissableLayer`). Verify no focusable elements in background while
        modal open (`inert` or `aria-hidden` on siblings).
      - **B4 Dependency & supply chain:** verify no new deps without an entry in
        `docs/internal/PACKAGES.md`. Run `npm audit` — fail on high/critical.
        Verify peer deps declared in `package.json`. Grep for `eval`, `new Function`,
        `Function(` — any hit is a FAIL (CSP violation).
      - **B5 CSP friendliness:** grep for inline handlers (`onclick=`, `onload=`
        as HTML attributes — React's `onClick` is fine). Grep for inline `<style>`
        or `<script>` blocks in output. Verify CSS animations use classes/tokens,
        not inline `style` with dynamic JS strings. Verify `window.location`/
        `document.cookie` access is guarded.
      - **B6 Form & validation security:** verify client-side validation is
        documented as not a substitute for server-side. Verify password fields use
        `type="password"` + `showToggleIcon`. Verify `autocomplete` attributes
        (`"off"` for OTP, `"current-password"` for login).
      - **B7 Secrets hygiene:** grep for hardcoded API keys/tokens/passwords/PII in
        source, stories, tests. Verify stories use mock data. Verify `.env` not
        committed and `process.env.*` is typed/guarded.

      ## 3. Responsiveness review (C1-C7)
      - **C1 Breakpoints:** test at 375px, 768px, 1440px (Storybook viewport
        toolbar, or render in a browser). Check for horizontal scrollbars at 375
        (except intentional `Table` scroll). Verify no fixed `width`/`maxWidth`
        breaking below 375. Verify `Grid` uses responsive columns. Verify
        `DashboardShell` collapses sidebar — no fixed `marginLeft: 320` gap.
      - **C2 Navigation responsiveness:** `AppSidebar` collapses to rail/drawer on
        mobile. `AppTopbar` search expands full-width + hamburger appears.
        `Breadcrumb` truncates/wraps. `Stepper` goes vertical/condensed on mobile.
      - **C3 Data display:** `Table` scrolls horizontally or stacks. `Tabs` wrap or
        scroll. Charts resize via container width (no fixed pixel dims). `Card`
        content reflows; `CardAction` doesn't overflow.
      - **C4 Forms:** fields stack vertically on mobile. Inputs full-width or
        max-width-constrained. `OtpBox` fits 375px. `DatePicker` popover stays in
        viewport.
      - **C5 Touch & interaction:** ≥44×44px on mobile. `Button` `sm` min for
        primary actions on mobile. Hover-only interactions (`ToolTip`, `Popover`
        hover triggers) have a tap fallback. Gestures wired where expected.
      - **C6 Theme & preference:** dark mode renders — no hardcoded light-only
        colors (grep for hex in CSS — should be `var(--color-*)`).
        `prefers-reduced-motion` reduces/disables animations. `useMediaQuery` for
        JS-driven responsive logic (not `window.innerWidth` polling).
        `forced-colors` doesn't break layout.
      - **C7 Density & composition:** 5-zone layout holds at all breakpoints (zones
        stack, don't disappear). CTA hierarchy preserved (one `variant="primary"`
        per zone max — count them). `size="sm"` for compact density where
        `COMPOSITION_RULES_1.md` dictates. No horizontal scrollbar at 375.

      ## 4. PR-diff scoping
      When reviewing a git diff (work type 6), scope the check to lines touched by
      the diff — but flag regressions in surrounding code if the change introduces
      them. Use `git diff main...feature -- <path>` to scope. For each added/modified
      line, run the relevant checklist items. For context lines, only flag if the
      change breaks an invariant they relied on (e.g., removing a `useFocusTrap`
      import breaks focus-trap for the whole component, not just the touched line).

      ## 5. Verdict-file format
      Produce the verdict in the exact format specified at the bottom of
      `_fleet/QUALITY_CHECKLIST.md` (reproduced here for the agent; do not deviate):
      ```
      ## Accessibility: PASS / FAIL
      - [PASS] A1 Keyboard — Tab order verified (src/components/X/index.tsx:42)
      - [FAIL] A4 Contrast — Button ghost variant text #999 on #fff = 2.85:1 (src/components/X/index.tsx:88) — use token --color-text-secondary

      ## Security: PASS / FAIL
      - [PASS] B1 XSS — no dangerouslySetInnerHTML (grep clean)
      - [FAIL] B4 Deps — npm audit reports 1 high (lodash@4.17.20) — upgrade or document

      ## Responsiveness: PASS / FAIL
      - [PASS] C1 Breakpoints — tested 375/768/1440, no horizontal scroll
      - [FAIL] C7 Density — two variant="primary" in Zone 1 (app/dashboard/page.tsx:45, :52) — demote one to outlineSecondary

      ## Ranked fix list
      1. [component-author] Fix contrast in X (src/components/X/index.tsx:88)
      2. [screen-composer] Demote competing CTA (app/dashboard/page.tsx:52)
      ```
      Every FAIL cites `file:line` and the checklist item id (A4, B1, C2). Every fix
      in the ranked list names the owning agent (`component-author` or
      `screen-composer`). The verdict file is the reviewer's ONLY write — never edit
      source. A FAIL on any dimension bounces the artifact back via the iteration
      loop (max 3).

      ## 6. Ranked-fix-list prioritization rubric
      Rank fixes by ship-blocking severity:
      - **P0 — blocks ship:** security XSS/accessibility blocker (e.g.
        `dangerouslySetInnerHTML`, no focus trap on Modal, keyboard-inaccessible
        primary action). Fix immediately or the artifact does not ship.
      - **P1 — blocks ship:** accessibility contrast failure (<4.5:1 text),
        focus-restore failure, responsiveness breakage (horizontal scroll at 375,
        fixed width breaking layout). Fix before ship.
      - **P2 — should fix before ship:** code quality (escape-hatch `className` on
        a prop-covered visual), missing story, legacy alias (`AppShell`/`Avatar`/
        `Tooltip`/`TextInput`/`variant="outlined"`), missing `aria-live` on a
        non-critical feedback state.
      - **P3 — nice to have:** nitpicks, doc gaps, story polish.
      Order the fix list P0 → P3. Within a priority, group by owning agent so each
      producer gets a contiguous block of work.
