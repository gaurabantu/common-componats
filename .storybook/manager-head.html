<!--
  Storybook manager shell (sidebar, toolbar). Lighthouse audits the whole tab, including this.
  - Viewport: Storybook may inject user-scalable=no; we normalize after load.
  - Buttons: icon-only toolbar buttons get aria-label from title when present.
  - Do NOT use a perpetual document MutationObserver here — Storybook mutates the tree constantly
    and scanning all buttons on every change can freeze the tab (white screen).
-->
<title>Infinia StoryBook</title>
<link rel="icon" type="image/png" href="/infinia-icon.png" />
<link rel="stylesheet" href="/design-system/tokens.css" />
<link rel="stylesheet" href="/infinia-manager-brand.css" />
<meta
  name="viewport"
  content="width=device-width, initial-scale=1, maximum-scale=5, viewport-fit=cover"
/>
<meta
  name="description"
  content="Infinia StoryBook — ui-common-components UX Governance design system."
/>
<script>
  (function () {
    "use strict";
    function safeViewportContent() {
      return "width=device-width, initial-scale=1, maximum-scale=5, viewport-fit=cover";
    }
    function enforceViewport() {
      var metas = document.querySelectorAll('meta[name="viewport"]');
      if (metas.length === 0) {
        var m = document.createElement("meta");
        m.setAttribute("name", "viewport");
        m.setAttribute("content", safeViewportContent());
        document.head.insertBefore(m, document.head.firstChild);
        return;
      }
      metas.forEach(function (el) {
        var c = el.getAttribute("content") || "";
        if (/user-scalable\s*=\s*no/i.test(c)) {
          el.setAttribute("content", safeViewportContent());
          return;
        }
        var match = /maximum-scale\s*=\s*([^,;]+)/i.exec(c);
        if (match) {
          var v = parseFloat(match[1], 10);
          if (!isNaN(v) && v < 5) el.setAttribute("content", safeViewportContent());
        }
      });
    }
    function fixUnlabeledButtons() {
      document.querySelectorAll("button").forEach(function (btn) {
        if (btn.getAttribute("aria-label") || btn.getAttribute("aria-labelledby")) return;
        var txt = (btn.textContent || "").replace(/\s+/g, " ").trim();
        if (txt.length) return;
        var label =
          btn.getAttribute("title") ||
          btn.getAttribute("data-tooltip") ||
          (btn.querySelector("svg title") && btn.querySelector("svg title").textContent.trim()) ||
          "";
        if (label) btn.setAttribute("aria-label", label);
      });
    }
    function run() {
      enforceViewport();
      fixUnlabeledButtons();
    }
    function runBoundedPasses() {
      run();
      [250, 1000, 3000].forEach(function (ms) {
        setTimeout(run, ms);
      });
    }
    if (document.readyState === "loading") {
      document.addEventListener("DOMContentLoaded", runBoundedPasses);
    } else {
      runBoundedPasses();
    }
    window.addEventListener("load", runBoundedPasses);
  })();
</script>
<!--
  Storybook hides `brandTitle` when `brandImage` is set (title becomes img alt only).
  Inject a compact label beside the logo and keep a horizontal layout.
-->
<script>
  (function () {
    "use strict";
    var BRAND_TEXT = "Infinia StoryBook";
    var done = false;

    function hasVisibleLabel(link) {
      return Array.from(link.children).some(function (el) {
        if (el.tagName === "IMG") return false;
        if (el.hasAttribute && el.hasAttribute("data-infinia-brand-text")) return true;
        return (el.textContent || "").trim().length > 0;
      });
    }

    function layout(link) {
      link.style.display = "inline-flex";
      link.style.alignItems = "center";
      link.style.gap = "10px";
    }

    function enhance() {
      if (done) return true;
      var found = false;
      document.querySelectorAll('img[src*="infinia-icon"]').forEach(function (img) {
        found = true;
        var link = img.closest("a");
        if (!link || link.getAttribute("data-infinia-brand-done")) return;

        layout(link);

        if (hasVisibleLabel(link)) {
          link.setAttribute("data-infinia-brand-done", "true");
          return;
        }

        var span = document.createElement("span");
        span.setAttribute("data-infinia-brand-text", "");
        span.textContent = BRAND_TEXT;
        span.style.fontWeight = "600";
        span.style.fontSize = "13px";
        span.style.lineHeight = "1.25";
        span.style.color = "inherit";
        span.style.whiteSpace = "nowrap";

        if (img.nextSibling) link.insertBefore(span, img.nextSibling);
        else link.appendChild(span);

        link.setAttribute("aria-label", BRAND_TEXT);
        link.setAttribute("data-infinia-brand-done", "true");
      });
      if (found) done = true;
      return done;
    }

    function runBoundedPasses() {
      if (enhance()) return;
      var delays = [100, 400, 1200, 3000];
      var observer = new MutationObserver(function () {
        if (enhance()) observer.disconnect();
      });
      observer.observe(document.documentElement, { childList: true, subtree: true });
      delays.forEach(function (ms) {
        setTimeout(function () {
          if (enhance()) observer.disconnect();
        }, ms);
      });
      setTimeout(function () {
        observer.disconnect();
      }, 5000);
    }

    if (document.readyState === "loading") {
      document.addEventListener("DOMContentLoaded", runBoundedPasses);
    } else {
      runBoundedPasses();
    }
    window.addEventListener("load", runBoundedPasses);
  })();
</script>
